name: static-checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc make perl

      - name: Run static checks
        run: ./ci/check.sh

  defconfig:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc make

      - name: Validate daisy_defconfig (olddefconfig round-trip)
        run: |
          make ARCH=arm64 O=out daisy_defconfig
          make ARCH=arm64 O=out olddefconfig
          grep -q '^CONFIG_DFG=y' out/.config
          grep -q '^CONFIG_MEMCG=y' out/.config

      - name: Verify kernel version banner
        run: |
          test "$(make O=out -s kernelversion)" = "4.9.337"

      - name: Upload generated config as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daisy-defconfig-validated
          path: out/.config