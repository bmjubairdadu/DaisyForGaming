name: kernel-build

on:
  push:
    branches: [main]
    tags: ["kernel-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-13 llvm-13 lld-13 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            make zip python3

      - name: Build kernel (daisy_defconfig)
        env:
          ARCH: arm64
        run: |
          export PATH="/usr/lib/llvm-13/bin:$PATH"
          export CC=clang-13
          export AR=llvm-ar AS=llvm-as NM=llvm-nm LD=ld.lld
          export STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          export OBJSIZE=llvm-size READELF=llvm-readelf
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out daisy_defconfig
          make -j$(nproc) O=out

      - name: Verify artifacts
        run: |
          test -f out/arch/arm64/boot/Image.gz-dtb && echo "Image.gz-dtb OK"
          gzip -dc out/arch/arm64/boot/Image.gz-dtb | strings | grep -m1 'Linux version'

      - name: Package AnyKernel3 ZIP
        run: |
          rm -rf .pkg && cp -r pack/ak3 .pkg
          cp out/arch/arm64/boot/Image.gz-dtb .pkg/Image.gz-dtb
          cd .pkg && zip -r9q ../dist/DaisyForGaming_ci.zip .
          cd .. && sha256sum dist/DaisyForGaming_ci.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaisyForGaming_ci
          path: dist/DaisyForGaming_ci.zip

  release:
    if: startsWith(github.ref, 'refs/tags/kernel-v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: DaisyForGaming_ci
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" dist/DaisyForGaming_ci.zip \
            --title "DaisyForGaming kernel $TAG" \
            --notes "CI build from $(git rev-parse --short HEAD)"
