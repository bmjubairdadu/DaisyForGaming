name: kernel-build

on:
  push:
    branches: [main]
    tags: ["kernel-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain & dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget gnupg lsb-release software-properties-common
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-13 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy-13.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-13 llvm-13 lld-13 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            make zip python3 bc flex bison libssl-dev libelf-dev dwarves \
            kmod cpio rsync 2>&1 | tail -5
          # Map clang-13 tools
          for t in clang clang++ llvm-ar llvm-as llvm-nm llvm-strip llvm-objcopy \
                   llvm-objdump llvm-size llvm-readelf ld.lld; do
            sudo ln -sf "/usr/bin/$t-13" "/usr/local/bin/$t"
          done
          echo "=== Toolchain verified ==="
          clang --version | head -1
          aarch64-linux-gnu-gcc --version | head -1
          ld.lld --version | head -1

      - name: Toolchain diagnostics
        run: |
          set -euxo pipefail
          echo "=== System info ==="
          uname -a
          lsb_release -a || true
          echo ""
          echo "=== Tool discovery ==="
          which clang || true
          clang --version || true
          echo "---"
          which clang-13 || true
          clang-13 --version || true
          echo "---"
          which ld.lld || true
          ld.lld --version || true
          echo "---"
          which ld.lld-13 || true
          ld.lld-13 --version || true
          echo "---"
          which llvm-ar || true
          llvm-ar --version || true
          echo "---"
          which llvm-ar-13 || true
          llvm-ar-13 --version || true
          echo "---"
          which llvm-nm || true
          llvm-nm --version || true
          echo "---"
          which llvm-objcopy || true
          llvm-objcopy --version || true
          echo "---"
          dpkg -l | grep -E 'clang|llvm|lld' || true
          echo ""
          echo "=== Environment ==="
          echo "PATH=$PATH"
          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "LLVM=$LLVM"
          echo "LLVM_IAS=$LLVM_IAS"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT"

      - name: Verify LLVM apt repository
        run: |
          set -euo pipefail
          echo "=== LLVM repo check ==="
          cat /etc/apt/sources.list.d/llvm-toolchain-jammy-13.list
          echo "---"
          apt-cache policy clang-13 || true
          apt-cache policy llvm-13 || true
          apt-cache policy lld-13 || true
          echo "---"
          echo "=== Package availability ==="
          apt-cache search '^clang-13$' || true
          apt-cache search '^llvm-13$' || true
          apt-cache search '^lld-13$' || true

      - name: Configure kernel
        run: |
          set -euo pipefail
          make O=out daisy_defconfig
          echo "=== Key configs ==="
          grep -E "CONFIG_(ANDROID|FUTEX2|DFG|MEMCG|CRYPTO_USER|DEBUG_INFO|LTO)" out/.config

      - name: Build kernel
        run: |
          set -euo pipefail
          make -j$(nproc) O=out \
            CC=clang AR=llvm-ar AS=llvm-as NM=llvm-nm LD=ld.lld \
            STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            OBJSIZE=llvm-size READELF=llvm-readelf \
            HOSTCC=gcc HOSTCXX=g++ \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KBUILD_BUILD_USER=ci KBUILD_BUILD_HOST=github-actions \
            Image.gz-dtb dtbs modules 2>&1 | tail -50

      - name: Verify kernel image
        run: |
          set -euo pipefail
          test -f out/arch/arm64/boot/Image.gz-dtb && echo "Image.gz-dtb OK"
          gzip -dc out/arch/arm64/boot/Image.gz-dtb | strings | grep -m1 'Linux version'

      - name: Install modules
        run: |
          set -euo pipefail
          rm -rf out/modules
          make -j$(nproc) O=out \
            CC=clang AR=llvm-ar AS=llvm-as NM=llvm-nm LD=ld.lld \
            STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            OBJSIZE=llvm-size READELF=llvm-readelf \
            HOSTCC=gcc HOSTCXX=g++ \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KBUILD_BUILD_USER=ci KBUILD_BUILD_HOST=github-actions \
            INSTALL_MOD_PATH=out/modules modules_install 2>&1 | tail -10

      - name: List modules
        run: |
          if [ -d "out/modules" ]; then
            find out/modules -name "*.ko" | wc -l
            find out/modules -name "*.ko" | head -10
          else
            echo "WARNING: No modules directory"
          fi

      - name: Package AnyKernel3 ZIP
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -rf .pkg && cp -r pack/ak3 .pkg
          cp out/arch/arm64/boot/Image.gz-dtb .pkg/Image.gz-dtb
          if [ -d "out/modules" ]; then
            find out/modules -name "*.ko" -exec cp {} .pkg/ \;
          fi
          cd .pkg && zip -r9q ../dist/DaisyForGaming_ci.zip .
          cd .. && sha256sum dist/DaisyForGaming_ci.zip

      - name: Package Magisk module ZIP
        run: |
          set -euo pipefail
          mkdir -p magisk-module/system/lib/modules
          cp out/arch/arm64/boot/Image.gz-dtb magisk-module/
          if [ -d "out/modules" ]; then
            find out/modules -name "*.ko" -exec cp {} magisk-module/system/lib/modules/ \;
          fi
          cd magisk-module
          DATE=$(date +%Y%m%d)
          zip -r9q "../dist/dfg_kernel-${DATE}.zip" .
          cd ..
          sha256sum dist/dfg_kernel-${DATE}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaisyForGaming_ci
          path: |
            dist/DaisyForGaming_ci.zip
            dist/dfg_kernel-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/kernel-v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: DaisyForGaming_ci
          path: dist

      - name: List artifacts
        run: ls -la dist/

      - name: Install gh CLI
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ANYKERNEL_ZIP=$(ls dist/DaisyForGaming_ci.zip 2>/dev/null || true)
          MAGISK_ZIP=$(ls dist/dfg_kernel-*.zip 2>/dev/null | head -1 || true)
          
          ASSETS=()
          [ -n "$ANYKERNEL_ZIP" ] && ASSETS+=("$ANYKERNEL_ZIP")
          [ -n "$MAGISK_ZIP" ] && ASSETS+=("$MAGISK_ZIP")
          
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "ERROR: No artifacts found!"
            exit 1
          fi
          
          NOTES="CI build from $(git rev-parse --short HEAD)

**Artifacts:**
- DaisyForGaming_ci.zip - AnyKernel3 TWRP flashable ZIP
- dfg_kernel-*.zip - Magisk module ZIP

**Installation:**
- TWRP: Flash DaisyForGaming_ci.zip
- Magisk: Install dfg_kernel-*.zip via Magisk Manager
- Fastboot: fastboot boot out/arch/arm64/boot/Image.gz-dtb

See flash_instructions.md for details."

          gh release create "$TAG" "${ASSETS[@]}" \
            --title "DaisyForGaming kernel $TAG" \
            --notes "$NOTES"