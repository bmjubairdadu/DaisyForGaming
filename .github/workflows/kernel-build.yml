name: kernel-build

on:
  push:
    branches: [main]
    tags: ["kernel-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-13 llvm-13 lld-13 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            make zip python3
          # kernel LTO invokes unversioned names; map the clang-13 tools
          for t in clang clang++ llvm-ar llvm-as llvm-nm llvm-strip llvm-objcopy \
                   llvm-objdump llvm-size llvm-readelf ld.lld; do
            sudo ln -sf "/usr/bin/$t-13" "/usr/local/bin/$t"
          done

      - name: Build kernel (daisy_defconfig)
        # Toolchain MUST be passed on the make command line: the kernel
        # Makefile assigns CC = $(CROSS_COMPILE)gcc, which overrides env vars.
        run: |
          make O=out daisy_defconfig
          make -j$(nproc) O=out \
            CC=clang-13 AR=llvm-ar-13 AS=llvm-as-13 NM=llvm-nm-13 LD=ld.lld \
            STRIP=llvm-strip-13 OBJCOPY=llvm-objcopy-13 OBJDUMP=llvm-objdump-13 \
            OBJSIZE=llvm-size-13 READELF=llvm-readelf-13 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Verify artifacts
        run: |
          test -f out/arch/arm64/boot/Image.gz-dtb && echo "Image.gz-dtb OK"
          gzip -dc out/arch/arm64/boot/Image.gz-dtb | strings | grep -m1 'Linux version [0-9]'

      - name: Package AnyKernel3 ZIP
        run: |
          mkdir -p dist
          rm -rf .pkg && cp -r pack/ak3 .pkg
          cp out/arch/arm64/boot/Image.gz-dtb .pkg/Image.gz-dtb
          cd .pkg && zip -r9q ../dist/DaisyForGaming_ci.zip .
          cd .. && sha256sum dist/DaisyForGaming_ci.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaisyForGaming_ci
          path: dist/DaisyForGaming_ci.zip

  release:
    if: startsWith(github.ref, 'refs/tags/kernel-v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: DaisyForGaming_ci
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" dist/DaisyForGaming_ci.zip \
            --title "DaisyForGaming kernel $TAG" \
            --notes "CI build from $(git rev-parse --short HEAD)"
