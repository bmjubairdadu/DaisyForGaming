# DaisyForGaming custom thermal engine (daisy / msm8953)
# Sustained gaming profile: throttle starts at 42C instead of stock 45C+,
# gradual GPU steps instead of hard throttle.

[SS-CPU0]
algo_type        ss
sampling         1000
sensor           xo_therm
device           cpu0
set_point        42000
set_point_clr    38000

[SS-CPU4]
algo_type        ss
sampling         1000
sensor           xo_therm
device           cpu4
set_point        42000
set_point_clr    38000

[SS-GPU]
algo_type        ss
sampling         1000
sensor           gpu_therm
device           gpu
set_point        42000
set_point_clr    38000

[CHARGE-MONITOR]
algo_type        monitor
sampling         5000
sensor           battery
device           battery
