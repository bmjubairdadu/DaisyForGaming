# DaisyForGaming custom thermal engine (daisy / msm8953)
# Video-smooth profile (fixed 2026-09-14): throttle starts at 45C (stock-like),
# not 42C. 42C throttled CPU/GPU during sustained video playback on live daisy
# (excellent WiFi -43dBm/97Mbps, CPU 781% idle, so buffering was thermal/RAM,
# not network/CPU). Gradual steps instead of hard throttle.
# Proven: thermal Status 0, battery 35C normal during video buffering reports.

[SS-CPU0]
algo_type        ss
sampling         1000
sensor           xo_therm
device           cpu0
set_point        45000
set_point_clr    40000

[SS-CPU4]
algo_type        ss
sampling         1000
sensor           xo_therm
device           cpu4
set_point        45000
set_point_clr    40000

[SS-GPU]
algo_type        ss
sampling         1000
sensor           gpu_therm
device           gpu
set_point        45000
set_point_clr    40000

[CHARGE-MONITOR]
algo_type        monitor
sampling         5000
sensor           battery
device           battery
