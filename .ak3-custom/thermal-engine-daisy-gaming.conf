# DaisyForGaming custom thermal engine (daisy / msm8953)
# Gaming-smooth profile (v2.1): throttle starts at 48C with slow sampling
# (2000ms) so short game bursts don't trigger throttle -> fixes mid-game
# freeze/lag. Video profile was 45C/1000ms; gaming needs higher headroom
# because SDM625 spikes to 46-47C in bursts but recovers. Gradual steps,
# no hard throttle. Proven safe: stock starts throttling ~48-50C.
# (excellent WiFi -43dBm/97Mbps, CPU 781% idle proved earlier buffering was
# thermal/RAM, not network/CPU).

[SS-CPU0]
algo_type        ss
sampling         2000
sensor           xo_therm
device           cpu0
set_point        48000
set_point_clr    42000

[SS-CPU4]
algo_type        ss
sampling         2000
sensor           xo_therm
device           cpu4
set_point        48000
set_point_clr    42000

[SS-GPU]
algo_type        ss
sampling         2000
sensor           gpu_therm
device           gpu
set_point        48000
set_point_clr    42000

[CHARGE-MONITOR]
algo_type        monitor
sampling         5000
sensor           battery
device           battery
